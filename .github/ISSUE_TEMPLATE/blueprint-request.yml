name: Blueprint request
description: Ask for a new blueprint
labels: ["blueprint request"]
body:
  - type: input
    id: name
    attributes:
      label: What should it be called?
    validations:
      required: true
  - type: textarea
    id: features
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: Link to a paid version, if there is one
