name: Discord notification

on:
  issues:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USER_ID: ${{ secrets.DISCORD_USER_ID }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          URL: ${{ github.event.issue.html_url }}
          AUTHOR: ${{ github.event.issue.user.login }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
        run: |
          payload=$(jq -n \
            --arg content "<@${USER_ID}> New issue" \
            --arg uid "$USER_ID" \
            --arg title "#${NUMBER}: ${TITLE}" \
            --arg url "$URL" \
            --arg desc "$BODY" \
            --arg author "$AUTHOR" \
            --arg labels "${LABELS:-none}" \
            '{
              content: $content,
              allowed_mentions: { users: [$uid] },
              embeds: [{
                title: $title,
                url: $url,
                description: ($desc[0:500]),
                fields: [
                  { name: "Type", value: $labels, inline: true },
                  { name: "Opened by", value: $author, inline: true }
                ]
              }]
            }')
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL"
